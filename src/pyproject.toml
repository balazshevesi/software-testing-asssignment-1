[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# `addopts` is **specific to pytest. it adds additional stuff onto the pytest command**
# run `open htmlcov/index.html` to open the html file
addopts = "--cov=. --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = ["."]
